name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 用 runner 內建的 Chrome，不另外下載 Puppeteer 的 Chromium
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Vite build
        run: pnpm build:spa

      # 與 Netlify 正式部署相同的預渲染。任一路由沒渲染成功、Chrome 起不來，
      # 或 FAQ 結構化資料與頁面內容不一致，CI 會變紅；sitemap coverage、canonical、
      # hreflang 目前只輸出警告，請看這一步的 log。
      - name: Prerender + SEO checks
        run: pnpm prerender
        env:
          PRERENDER_REQUIRED: "1"
          # FAQ JSON-LD must match the FAQ shown on the page (warn-only on Netlify)
          STRICT_SEO_CHECKS: "1"
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
